<div id="this-week-festival-logo" class="viz-dotted-background" aria-label="이번주축제 지도형 로고 시안">
  <style>
    #this-week-festival-logo { color-scheme:light dark; font-family:Arial,"Noto Sans KR",sans-serif; padding:24px 14px; }
    #this-week-festival-logo * { box-sizing:border-box; }
    #this-week-festival-logo .brand-surface { max-width:560px; margin:0 auto; padding:28px 25px; border-radius:22px; background:light-dark(#ffffff,#201d2b); color:light-dark(#211735,#f5f0ff); }
    #this-week-festival-logo .brand-header { display:flex; gap:14px; align-items:center; }
    #this-week-festival-logo .brand-symbol { display:flex; flex-shrink:0; color:#6a27ef; }
    #this-week-festival-logo .brand-symbol .lucide { width:52px !important; height:52px !important; stroke-width:2; }
    #this-week-festival-logo .brand-name { font-size:28px; font-weight:750; letter-spacing:-1.3px; line-height:1.3; }
    #this-week-festival-logo .brand-description { font-size:12px; line-height:1.7; color:light-dark(#6a637b,#b9b1cd); margin-top:4px; }
    #this-week-festival-logo .brand-examples { display:flex; justify-content:center; gap:42px; align-items:flex-end; margin-top:30px; }
    #this-week-festival-logo .brand-example { display:flex; flex-direction:column; align-items:center; gap:10px; }
    #this-week-festival-logo .brand-mark { display:grid; place-items:center; background:#ff6426; color:#ffffff; }
    #this-week-festival-logo .brand-app { width:94px; height:94px; border-radius:25px; }
    #this-week-festival-logo .brand-app .lucide { width:57px !important; height:57px !important; stroke-width:1.9; }
    #this-week-festival-logo .brand-tab { width:24px; height:24px; border-radius:6px; }
    #this-week-festival-logo .brand-tab .lucide { width:17px !important; height:17px !important; stroke-width:2.3; }
    #this-week-festival-logo .brand-caption { font-size:11px; color:light-dark(#6a637b,#b9b1cd); }
    @media(max-width:420px) {
      #this-week-festival-logo { padding:20px 8px; }
      #this-week-festival-logo .brand-surface { padding:26px 18px; }
      #this-week-festival-logo .brand-header { gap:10px; }
      #this-week-festival-logo .brand-name { font-size:25px; }
      #this-week-festival-logo .brand-description { font-size:11px; }
      #this-week-festival-logo .brand-symbol .lucide { width:43px !important; height:43px !important; }
    }
  </style>
  <div class="brand-surface">
    <div class="brand-header">
      <span class="brand-symbol"><i data-lucide="map-pin" aria-hidden="true"></i></span>
      <div><div class="brand-name">이번주축제</div><div class="brand-description">전국 축제 일정과 내 주변 축제를 한눈에.</div></div>
    </div>
    <div class="brand-examples">
      <div class="brand-example"><span class="brand-mark brand-app"><i data-lucide="map-pin" aria-hidden="true"></i></span><span class="brand-caption">앱 아이콘</span></div>
      <div class="brand-example"><span class="brand-mark brand-tab"><i data-lucide="map-pin" aria-hidden="true"></i></span><span class="brand-caption">브라우저 탭</span></div>
    </div>
  </div>
</div>
